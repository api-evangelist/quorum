naftiko: 1.0.0-alpha2
info:
  label: Quorum Land Management API — DivisionOrders
  description: 'Quorum Land Management API — DivisionOrders. 1 operations. Lead operation: List division orders. Self-contained
    Naftiko capability covering one Quorum business surface.'
  tags:
  - Quorum
  - DivisionOrders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUORUM_API_KEY: QUORUM_API_KEY
capability:
  consumes:
  - type: http
    namespace: land-management-divisionorders
    baseUri: https://api.quorumsoftware.com/v1
    description: Quorum Land Management API — DivisionOrders business capability. Self-contained, no shared references.
    resources:
    - name: division-orders
      path: /division-orders
      operations:
      - name: listdivisionorders
        method: GET
        description: List division orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: wellId
          in: query
          type: string
          description: Filter by well
        - name: ownerId
          in: query
          type: string
          description: Filter by owner
        - name: status
          in: query
          type: string
        - name: offset
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.QUORUM_API_KEY}}'
  exposes:
  - type: rest
    namespace: land-management-divisionorders-rest
    port: 8080
    description: REST adapter for Quorum Land Management API — DivisionOrders. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/division-orders
      name: division-orders
      description: REST surface for division-orders.
      operations:
      - method: GET
        name: listdivisionorders
        description: List division orders
        call: land-management-divisionorders.listdivisionorders
        with:
          wellId: rest.wellId
          ownerId: rest.ownerId
          status: rest.status
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: land-management-divisionorders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Quorum Land Management API — DivisionOrders. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-division-orders
      description: List division orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: land-management-divisionorders.listdivisionorders
      with:
        wellId: tools.wellId
        ownerId: tools.ownerId
        status: tools.status
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.

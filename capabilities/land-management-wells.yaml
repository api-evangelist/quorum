naftiko: 1.0.0-alpha2
info:
  label: Quorum Land Management API — Wells
  description: 'Quorum Land Management API — Wells. 2 operations. Lead operation: List wells. Self-contained Naftiko capability
    covering one Quorum business surface.'
  tags:
  - Quorum
  - Wells
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    QUORUM_API_KEY: QUORUM_API_KEY
capability:
  consumes:
  - type: http
    namespace: land-management-wells
    baseUri: https://api.quorumsoftware.com/v1
    description: Quorum Land Management API — Wells business capability. Self-contained, no shared references.
    resources:
    - name: wells
      path: /wells
      operations:
      - name: listwells
        method: GET
        description: List wells
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
        - name: state
          in: query
          type: string
        - name: county
          in: query
          type: string
        - name: offset
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
    - name: wells-wellId
      path: /wells/{wellId}
      operations:
      - name: getwell
        method: GET
        description: Get a well
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: wellId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.QUORUM_API_KEY}}'
  exposes:
  - type: rest
    namespace: land-management-wells-rest
    port: 8080
    description: REST adapter for Quorum Land Management API — Wells. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/wells
      name: wells
      description: REST surface for wells.
      operations:
      - method: GET
        name: listwells
        description: List wells
        call: land-management-wells.listwells
        with:
          status: rest.status
          state: rest.state
          county: rest.county
          offset: rest.offset
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/wells/{wellid}
      name: wells-wellid
      description: REST surface for wells-wellId.
      operations:
      - method: GET
        name: getwell
        description: Get a well
        call: land-management-wells.getwell
        with:
          wellId: rest.wellId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: land-management-wells-mcp
    port: 9090
    transport: http
    description: MCP adapter for Quorum Land Management API — Wells. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-wells
      description: List wells
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: land-management-wells.listwells
      with:
        status: tools.status
        state: tools.state
        county: tools.county
        offset: tools.offset
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-well
      description: Get a well
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: land-management-wells.getwell
      with:
        wellId: tools.wellId
      outputParameters:
      - type: object
        mapping: $.

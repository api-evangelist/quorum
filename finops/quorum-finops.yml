meters:
  - name: license_contract
    description: Enterprise license covering the contracted Quorum modules and API access.
    unit: varies
    aggregation: sum
    dimensions:
      - contract
      - module
principles:
  - name: Visibility
    description: Surface Quorum spend through the enterprise license register; the platform itself
      exposes operational telemetry inside the customer deployment but not as a billing meter.
  - name: Allocation
    description: Allocate license cost across the upstream business units consuming Land, Royalty, or
      Production modules; tag well or tract data to the operating asset for downstream FinOps reporting.
  - name: Optimization
    description: Right-size the licensed module set at renewal; deactivate modules and integrations
      that are no longer in use to avoid carrying capacity beyond steady-state need.
  - name: Accountability
    description: The land/operations IT team owns the Quorum contract; finance reviews module utilization
      against contracted entitlements at renewal.

notes: Quorum Software does not publish a per-API meter or invoice surface; FinOps mapping is anchored
  to the enterprise software contract.
description: FOCUS-aligned FinOps for Quorum Software is contract-based; Land Management, Royalty Accounting,
  and other modules are licensed per enterprise agreement rather than metered by API call.
